services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hakayat}
      POSTGRES_USER: ${POSTGRES_USER:-hakayat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
  redis:
    image: redis:8
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
volumes:
  postgres_data:
  redis_data:
